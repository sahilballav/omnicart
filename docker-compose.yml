version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnicart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: omnicart
      POSTGRES_USER: omnicart
      POSTGRES_PASSWORD: omnicart_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnicart -d omnicart"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnicart-network

  redis:
    image: redis:7-alpine
    container_name: omnicart-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass omnicart_redis_pass
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "omnicart_redis_pass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnicart-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: omnicart-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - omnicart-network

volumes:
  postgres_data:
    name: omnicart_postgres_data
  redis_data:
    name: omnicart_redis_data
  kafka_data:
    name: omnicart_kafka_data

networks:
  omnicart-network:
    name: omnicart-network
    driver: bridge

