  <text x="95" y="242" font-family="monospace" font-size="10" fill="#60a5fa">DAG Execution: Active</text>

  <!-- Arrow -->
  <path d="M260 210 L310 210" stroke="#60a5fa" stroke-width="2"/>

  <!-- Subagent 1: Tool Worker -->
  <rect x="310" y="140" width="180" height="100" rx="6" fill="#132328" stroke="#10b981" stroke-width="1.5"/>
  <text x="325" y="170" font-family="monospace" font-size="12" fill="#e2e8f0" font-weight="bold">Code Analysis Agent</text>
  <text x="325" y="192" font-family="monospace" font-size="10" fill="#94a3b8">AST Parsing + Linting</text>
  <text x="325" y="212" font-family="monospace" font-size="10" fill="#34d399">Tool: sandbox.exec()</text>

  <!-- Subagent 2: RAG Worker -->
  <rect x="310" y="260" width="180" height="100" rx="6" fill="#112233" stroke="#0284c7" stroke-width="1.5"/>
  <text x="325" y="290" font-family="monospace" font-size="12" fill="#e2e8f0" font-weight="bold">Vector Memory Agent</text>
  <text x="325" y="312" font-family="monospace" font-size="10" fill="#94a3b8">pgvector Cosine Sim</text>
  <text x="325" y="332" font-family="monospace" font-size="10" fill="#38bdf8">TopK: 5 // Colbert Rerank</text>

  <!-- Evaluator / Human in the loop -->
  <rect x="540" y="190" width="180" height="120" rx="6" fill="#2a1b18" stroke="#f97316" stroke-width="1.5"/>
  <text x="555" y="220" font-family="monospace" font-size="12" fill="#e2e8f0" font-weight="bold">Critic &amp; Evaluator</text>
  <text x="555" y="242" font-family="monospace" font-size="10" fill="#94a3b8">JSON Schema Validation</text>
  <text x="555" y="262" font-family="monospace" font-size="10" fill="#fb923c">Self-Correction Loop</text>
  <text x="555" y="282" font-family="monospace" font-size="10" fill="#fdba74">Status: Verified 94.2%</text>
