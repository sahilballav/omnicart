<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0b1120"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#grid)"/>

  <rect x="50" y="40" width="180" height="28" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="58" font-family="monospace" font-size="12" fill="#38bdf8" font-weight="bold">AGENTIC GRAPH // SDK</text>

  <!-- Orchestration Container -->
  <rect x="50" y="90" width="700" height="360" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="118" font-family="monospace" font-size="13" fill="#94a3b8">Hierarchical Multi-Agent Graph Engine</text>

  <!-- Planner Node -->
  <rect x="80" y="150" width="180" height="120" rx="6" fill="#172033" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="95" y="180" font-family="monospace" font-size="12" fill="#e2e8f0" font-weight="bold">Master Planner</text>
