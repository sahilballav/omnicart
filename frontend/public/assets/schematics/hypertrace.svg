<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#000000"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#grid)"/>

  <rect x="50" y="40" width="220" height="28" rx="4" fill="#1a1a1a" stroke="#262626" stroke-width="1"/>
  <text x="65" y="58" font-family="monospace" font-size="12" fill="#38bdf8" font-weight="bold">OPENTELEMETRY // DISTRIBUTED</text>

  <rect x="50" y="90" width="700" height="360" rx="8" fill="#0a0a0a" stroke="#262626" stroke-width="1.5"/>
  <text x="70" y="118" font-family="monospace" font-size="13" fill="#94a3b8">HyperTrace Distributed Call-Graph Profiler</text>

  <!-- Span 1 -->
  <rect x="80" y="150" width="640" height="45" rx="4" fill="#1a1a1a" stroke="#38bdf8" stroke-width="1"/>
  <text x="95" y="177" font-family="monospace" font-size="11" fill="#f8fafc">HTTP GET /api/v1/checkout [Client -> Gateway]</text>
  <text x="630" y="177" font-family="monospace" font-size="11" fill="#38bdf8">42ms</text>

  <!-- Span 2 -->
  <rect x="140" y="210" width="480" height="45" rx="4" fill="#0d0d0d" stroke="#60a5fa" stroke-width="1"/>
  <text x="155" y="237" font-family="monospace" font-size="11" fill="#f8fafc">AuthFilter.verifyToken() [JWKS Cache Hit]</text>
  <text x="540" y="237" font-family="monospace" font-size="11" fill="#60a5fa">1.2ms</text>

  <!-- Span 3 -->
  <rect x="180" y="270" width="380" height="45" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
  <text x="195" y="297" font-family="monospace" font-size="11" fill="#f8fafc">OrderService.reserveSeats() [PostgreSQL Tx]</text>
  <text x="480" y="297" font-family="monospace" font-size="11" fill="#34d399">8.4ms</text>

  <!-- Span 4 -->
  <rect x="220" y="330" width="280" height="45" rx="4" fill="#0a0a0a" stroke="#0ea5e9" stroke-width="1"/>
  <text x="235" y="357" font-family="monospace" font-size="11" fill="#f8fafc">KafkaProducer.publish("orders.placed")</text>
  <text x="420" y="357" font-family="monospace" font-size="11" fill="#38bdf8">2.1ms</text>
</svg>



