<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0b1120"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#grid)"/>

  <rect x="50" y="40" width="220" height="28" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="58" font-family="monospace" font-size="12" fill="#38bdf8" font-weight="bold">IDENTITY GATEWAY // JWT</text>

  <rect x="50" y="90" width="700" height="360" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="118" font-family="monospace" font-size="13" fill="#94a3b8">Zero-Trust JWT & OAuth2 Reverse Proxy Pipeline</text>

  <rect x="80" y="150" width="190" height="260" rx="6" fill="#172554" stroke="#2563eb" stroke-width="1.5"/>
  <text x="95" y="180" font-family="monospace" font-size="12" fill="#60a5fa" font-weight="bold">Inbound Traffic</text>
  <text x="95" y="210" font-family="monospace" font-size="10" fill="#94a3b8">- mTLS Handshake</text>
  <text x="95" y="235" font-family="monospace" font-size="10" fill="#94a3b8">- Header Inspection</text>
  <text x="95" y="260" font-family="monospace" font-size="10" fill="#94a3b8">- Token Extraction</text>
  <text x="95" y="320" font-family="monospace" font-size="10" fill="#38bdf8">TLS 1.3 Strict</text>

  <rect x="305" y="150" width="190" height="260" rx="6" fill="#1c1917" stroke="#ea580c" stroke-width="1.5"/>
  <text x="320" y="180" font-family="monospace" font-size="12" fill="#fb923c" font-weight="bold">JWKS Crypto Core</text>
  <text x="320" y="210" font-family="monospace" font-size="10" fill="#94a3b8">- Ed25519 Signature</text>
  <text x="320" y="235" font-family="monospace" font-size="10" fill="#94a3b8">- RFC 7517 Key Cache</text>
  <text x="320" y="260" font-family="monospace" font-size="10" fill="#94a3b8">- RBAC Role Evaluation</text>
  <text x="320" y="320" font-family="monospace" font-size="10" fill="#f97316">Sub-millisecond Check</text>

  <rect x="530" y="150" width="190" height="260" rx="6" fill="#14261d" stroke="#16a34a" stroke-width="1.5"/>
  <text x="545" y="180" font-family="monospace" font-size="12" fill="#4ade80" font-weight="bold">Upstream Service</text>
  <text x="545" y="210" font-family="monospace" font-size="10" fill="#94a3b8">- Validated Claims Header</text>
  <text x="545" y="235" font-family="monospace" font-size="10" fill="#94a3b8">- X-User-Identity</text>
  <text x="545" y="260" font-family="monospace" font-size="10" fill="#94a3b8">- Redis Blacklist Checked</text>
  <text x="545" y="320" font-family="monospace" font-size="10" fill="#22c55e">HTTP 200 Proxy Pass</text>
</svg>
