  <text x="545" y="235" font-family="monospace" font-size="10" fill="#94a3b8">Partition 0 [Follower]</text>
  <text x="545" y="260" font-family="monospace" font-size="10" fill="#94a3b8">Commit Log: ZSTD</text>
