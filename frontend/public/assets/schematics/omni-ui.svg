<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#000000"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#grid)"/>

  <rect x="50" y="40" width="220" height="28" rx="4" fill="#1a1a1a" stroke="#262626" stroke-width="1"/>
  <text x="65" y="58" font-family="monospace" font-size="12" fill="#38bdf8" font-weight="bold">DESIGN TOKENS // FIGMA &amp; REACT</text>

  <rect x="50" y="90" width="700" height="360" rx="8" fill="#0a0a0a" stroke="#262626" stroke-width="1.5"/>
  <text x="70" y="118" font-family="monospace" font-size="13" fill="#94a3b8">OmniUI Enterprise Component Hierarchy</text>

  <!-- Level 1: Tokens -->
  <rect x="80" y="145" width="180" height="275" rx="6" fill="#131e33" stroke="#1e40af" stroke-width="1"/>
  <text x="95" y="172" font-family="monospace" font-size="12" fill="#60a5fa" font-weight="bold">01. Primitives</text>
  <text x="95" y="200" font-family="monospace" font-size="10" fill="#94a3b8">- Color Palette: Slate, Zinc</text>
  <text x="95" y="222" font-family="monospace" font-size="10" fill="#94a3b8">- Typography: Inter / Mono</text>
  <text x="95" y="244" font-family="monospace" font-size="10" fill="#94a3b8">- Spacing Scale (4px-64px)</text>
  <text x="95" y="266" font-family="monospace" font-size="10" fill="#94a3b8">- Shadow &amp; Border Tokens</text>
  <text x="95" y="288" font-family="monospace" font-size="10" fill="#94a3b8">- Motion Curves (150ms)</text>
  <text x="95" y="325" font-family="monospace" font-size="10" fill="#38bdf8">Tokens: 420 Defined</text>

  <!-- Level 2: Components -->
  <rect x="300" y="145" width="200" height="275" rx="6" fill="#142426" stroke="#065f46" stroke-width="1"/>
  <text x="315" y="172" font-family="monospace" font-size="12" fill="#34d399" font-weight="bold">02. React Core</text>
  <text x="315" y="200" font-family="monospace" font-size="10" fill="#94a3b8">- Buttons, Inputs, Dialogs</text>
  <text x="315" y="222" font-family="monospace" font-size="10" fill="#94a3b8">- DataTable with Virtualization</text>
  <text x="315" y="244" font-family="monospace" font-size="10" fill="#94a3b8">- SlideDrawers &amp; Tooltips</text>
  <text x="315" y="266" font-family="monospace" font-size="10" fill="#94a3b8">- Metric Cards &amp; Badges</text>
  <text x="315" y="288" font-family="monospace" font-size="10" fill="#94a3b8">- ThemeProvider (Dark/Light)</text>
  <text x="315" y="325" font-family="monospace" font-size="10" fill="#10b981">WCAG 2.2 AAA Validated</text>

  <!-- Level 3: Layouts -->
  <rect x="540" y="145" width="180" height="275" rx="6" fill="#1a1a1a" stroke="#262626" stroke-width="1"/>
  <text x="555" y="172" font-family="monospace" font-size="12" fill="#e2e8f0" font-weight="bold">03. Templates</text>
  <text x="555" y="200" font-family="monospace" font-size="10" fill="#94a3b8">- SaaS Billing Portal</text>
  <text x="555" y="222" font-family="monospace" font-size="10" fill="#94a3b8">- Inventory Console</text>
  <text x="555" y="244" font-family="monospace" font-size="10" fill="#94a3b8">- Cloud Topology Canvas</text>
  <text x="555" y="266" font-family="monospace" font-size="10" fill="#94a3b8">- Auth &amp; Role Management</text>
  <text x="555" y="325" font-family="monospace" font-size="10" fill="#38bdf8">Figma Auto-Layout v5</text>
</svg>



