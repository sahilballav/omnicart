<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0b1120"/>
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Header Badge -->
  <rect x="50" y="40" width="160" height="28" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="58" font-family="monospace" font-size="12" fill="#38bdf8" font-weight="bold">AWS EKS v1.30 // IAC</text>

  <!-- VPC Container -->
  <rect x="50" y="90" width="700" height="360" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="70" y="118" font-family="monospace" font-size="13" fill="#94a3b8">Multi-AZ VPC (10.0.0.0/16)</text>

  <!-- AZ 1 -->
  <rect x="80" y="140" width="300" height="280" rx="6" fill="#111c33" stroke="#1e3a8a" stroke-width="1"/>
  <text x="100" y="168" font-family="monospace" font-size="12" fill="#60a5fa">Availability Zone: us-east-1a</text>
  
  <rect x="100" y="190" width="260" height="90" rx="4" fill="#0f172a" stroke="#2563eb" stroke-width="1"/>
  <text x="115" y="215" font-family="monospace" font-size="12" fill="#e2e8f0" font-weight="bold">Control Plane Node</text>
  <text x="115" y="235" font-family="monospace" font-size="11" fill="#94a3b8">Karpenter Autoscaler v0.35</text>
  <text x="115" y="255" font-family="monospace" font-size="10" fill="#38bdf8">m6i.xlarge // CNI Provisioned</text>

  <rect x="100" y="300" width="260" height="90" rx="4" fill="#0f172a" stroke="#059669" stroke-width="1"/>
  <text x="115" y="325" font-family="monospace" font-size="12" fill="#e2e8f0" font-weight="bold">Ingress NGINX + Cert-Mgr</text>
  <text x="115" y="345" font-family="monospace" font-size="11" fill="#94a3b8">NLB Dual-Stack SSL Termination</text>
  <text x="115" y="365" font-family="monospace" font-size="10" fill="#34d399">Health: 200 OK (3 Targets)</text>

  <!-- AZ 2 -->
  <rect x="420" y="140" width="300" height="280" rx="6" fill="#111c33" stroke="#1e3a8a" stroke-width="1"/>
  <text x="440" y="168" font-family="monospace" font-size="12" fill="#60a5fa">Availability Zone: us-east-1b</text>

  <rect x="440" y="190" width="260" height="90" rx="4" fill="#0f172a" stroke="#d97706" stroke-width="1"/>
  <text x="455" y="215" font-family="monospace" font-size="12" fill="#e2e8f0" font-weight="bold">ArgoCD GitOps Sync</text>
  <text x="455" y="235" font-family="monospace" font-size="11" fill="#94a3b8">Automated PR Reconciliation</text>
  <text x="455" y="255" font-family="monospace" font-size="10" fill="#fbbf24">Sync Status: Synced (Healthy)</text>

  <rect x="440" y="300" width="260" height="90" rx="4" fill="#0f172a" stroke="#7c3aed" stroke-width="1"/>
  <text x="455" y="325" font-family="monospace" font-size="12" fill="#e2e8f0" font-weight="bold">Prometheus + Grafana</text>
  <text x="455" y="345" font-family="monospace" font-size="11" fill="#94a3b8">OTel Tracing & AlertManager</text>
  <text x="455" y="365" font-family="monospace" font-size="10" fill="#a78bfa">Retention: 30d (EBS gp3)</text>
</svg>
