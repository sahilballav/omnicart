server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: omnicart-backend

  # PostgreSQL Data Source with HikariCP
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:omnicart}
    username: ${DB_USER:omnicart}
    password: ${DB_PASSWORD:omnicart_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: OmniCartHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # JPA & Hibernate (with Native JSONB support)
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # Flyway Schema Versioning
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  # Redis Session & Cart Cache
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:omnicart_redis_pass}
      timeout: 2000ms

  # Apache Kafka Broker & Pipeline
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: omnicart-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.omnicart.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

# Actuator Health & Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents,ratelimiters,retries
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true

# Resilience4j Enterprise Fault Tolerance Configurations
resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50.0
        slow-call-rate-threshold: 50.0
        slow-call-duration-threshold: 2000ms
        wait-duration-in-open-state: 10000ms
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      paymentGateway:
        base-config: default
        sliding-window-size: 6
        minimum-number-of-calls: 4
        failure-rate-threshold: 50.0
        wait-duration-in-open-state: 8000ms
      aiAssistant:
        base-config: default
        sliding-window-size: 8
        minimum-number-of-calls: 4
        failure-rate-threshold: 60.0
        slow-call-duration-threshold: 3000ms

  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
    instances:
      paymentGateway:
        base-config: default
        max-attempts: 3
      aiAssistant:
        base-config: default
        max-attempts: 2

  ratelimiter:
    configs:
      default:
        limit-for-period: 20
        limit-refresh-period: 1s
        timeout-duration: 0ms
    instances:
      paymentGateway:
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 100ms
      aiAssistant:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 500ms


